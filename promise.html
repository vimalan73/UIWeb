<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="simple"></h1>
    <h1 id="complicated"></h1>
    <script>
        let result = new Promise((resolve,reject)=>{
            let b = 7
            if(b==7){
                resolve("correct")
            }
            else{
                reject("wrong")
            }
             
        })
        result.then((value)=>{
            document.getElementById("simple").innerHTML=value
        })
        result.catch((error)=>{
           document.getElementById("complicated").innerHTML=error
        })

    </script>
    
</body>
</html>
