<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button style="background-color: green;" id="addition"></button>
     <button style="background-color:red;" id="subtraction"></button>
     <script>
        function same(a,b){
             var x = a+b
             var y = a-b

             if(x>0){
                document.getElementById("addition").innerHTML=same(10,10)
             }
             if(y>0){
                document.getElementById("subtraction").innerHTML=same(10,10)
            }
        }
     </script>
    
</body>
</html>
