<head>

<body>
    <h1 id="frog"></h1>
    <h1 id="frog1"></h1>

        let names = ["naruto", "jirya", "kakashi"];

        let Avengersteam3 = ["iron man", "spider man", "captain marvel"]
        let battle = Avengersteam1.concat(Avengersteam2, Avengersteam3);
        delete battle[3]

        document.getElementById("frog4").innerHTML = battle;


        let numbers = ['1', '2', '3', '4', '5'];
        let value = numbers.splice(2, 3,'6');
        document.getElementById("frog5").innerHTML = value;


        let numbers1 = ['1', '2', '3', '4', '5'];
        let value1 = numbers1.slice(2, 3);
        document.getElementById("frog6").innerHTML = value1;

        let student= {
            name : "vimalan",
            age : 21,
            course : "java",
            performance : "excellent"
            
        };
        let result = '<li>'+student.name+'</li>'+'<li>'+student.age+'</li>'+'<li>'+student.course+'</li>'+'<li>'+student.performance+'</li>'
         
        document.getElementById("frog7").innerHTML=result;
